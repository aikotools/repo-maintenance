name: Desktop Build

# Builds the Electron desktop installers (macOS universal .dmg, Windows .exe,
# Linux .AppImage) and attaches them to a GitHub Release.
#
# Triggers:
#   - Manually via the Actions tab (workflow_dispatch), pick a version.
#   - Pushing a tag like `desktop-v1.2.0` (own namespace so it doesn't clash
#     with semantic-release's `vX.Y.Z` npm tags).
#
# Artifacts are unsigned: macOS recipients right-click → Open (or
# `xattr -dr com.apple.quarantine RepoHub.app`); Windows shows a SmartScreen
# warning. Add Developer ID / cert secrets later for frictionless installs.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for the installers (e.g. 1.2.0)'
        required: true
        default: '0.1.0'
  push:
    tags:
      - 'desktop-v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac --universal
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Resolve version: tag `desktop-v1.2.0` → 1.2.0, else the dispatch input.
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#desktop-v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - run: pnpm build

      - name: Package installer
        shell: bash
        env:
          # Unsigned build — don't let electron-builder hunt for certs and hang.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm exec electron-builder ${{ matrix.target }} -p never -c.extraMetadata.version=${{ steps.ver.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=desktop-v${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: RepoHub ${{ steps.tag.outputs.tag }}
          files: dist-artifacts/**/*
          fail_on_unmatched_files: true
